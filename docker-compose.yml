services:
  postgres:
    image: postgres:17-alpine
    container_name: mentary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mentary}
      POSTGRES_USER: ${POSTGRES_USER:-mentary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mentary_local_password}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - mentary-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mentary} -d ${POSTGRES_DB:-mentary}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mentary-postgres-data:
